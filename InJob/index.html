<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindBodyHub — скоро открытие</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
      color: #1a2a4a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .stub {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 560px;
    }

    .stub__logo {
      width: min(280px, 70vw);
      height: auto;
      margin-bottom: 32px;
    }

    .stub__title {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .stub__text {
      font-size: clamp(1rem, 2.5vw, 1.125rem);
      font-weight: 400;
      line-height: 1.6;
      color: #4a5a7a;
    }
  </style>
</head>
<body>
  <main class="stub">
    <img
      class="stub__logo"
      src="braintoform.png"
      alt="MindBodyHub"
      width="280"
      height="280"
    />
    <h1 class="stub__title">Сайт находится в разработке</h1>
    <p class="stub__text">Скоро мы откроем доступ. Загляните к нам чуть позже.</p>
  </main>
</body>
</html>
