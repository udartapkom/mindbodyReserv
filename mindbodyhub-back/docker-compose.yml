services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mindbodyhub
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: mindbodyhub
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mindbodyhub -d mindbodyhub']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
