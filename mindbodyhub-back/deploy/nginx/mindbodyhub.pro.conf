# API — https://api.mindbodyhub.pro
server {
    listen 443 ssl http2;
    server_name api.mindbodyhub.pro;

  # ssl_certificate /etc/letsencrypt/live/api.mindbodyhub.pro/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/api.mindbodyhub.pro/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# MinIO S3 API — https://storage.mindbodyhub.pro
# Публичные картинки материалов, presigned URL для аватаров
server {
    listen 443 ssl http2;
    server_name storage.mindbodyhub.pro;

  # ssl_certificate /etc/letsencrypt/live/storage.mindbodyhub.pro/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/storage.mindbodyhub.pro/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# MinIO Console — только для админов, закрыть VPN / basic auth / IP whitelist
server {
    listen 443 ssl http2;
    server_name storage-admin.mindbodyhub.pro;

  # ssl_certificate /etc/letsencrypt/live/storage-admin.mindbodyhub.pro/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/storage-admin.mindbodyhub.pro/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
