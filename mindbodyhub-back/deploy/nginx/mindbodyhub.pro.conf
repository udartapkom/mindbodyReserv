# MindBodyHub — nginx (Ubuntu)
# Domains: mindbodyhub.pro, www, api, admin, minio
# Certs: certbot certonly --nginx -d mindbodyhub.pro -d www.mindbodyhub.pro -d api.mindbodyhub.pro -d admin.mindbodyhub.pro -d minio.mindbodyhub.pro

upstream mbh_api {
    server 127.0.0.1:4000;
    keepalive 8;
}

upstream mbh_front {
    server 127.0.0.1:3000;
    keepalive 8;
}

upstream mbh_minio {
    server 127.0.0.1:9000;
    keepalive 8;
}

# Redirect HTTP → HTTPS (all hosts)
server {
    listen 80;
    listen [::]:80;
    server_name mindbodyhub.pro www.mindbodyhub.pro api.mindbodyhub.pro admin.mindbodyhub.pro minio.mindbodyhub.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend (Next.js)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mindbodyhub.pro www.mindbodyhub.pro;

    ssl_certificate /etc/letsencrypt/live/mindbodyhub.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindbodyhub.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://mbh_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# API (NestJS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.mindbodyhub.pro;

    ssl_certificate /etc/letsencrypt/live/mindbodyhub.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindbodyhub.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://mbh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin SPA (static)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.mindbodyhub.pro;

    ssl_certificate /etc/letsencrypt/live/mindbodyhub.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindbodyhub.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# MinIO S3 API (public materials + presigned avatars)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name minio.mindbodyhub.pro;

    ssl_certificate /etc/letsencrypt/live/mindbodyhub.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindbodyhub.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    ignore_invalid_headers off;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://mbh_minio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        chunked_transfer_encoding off;
    }
}
